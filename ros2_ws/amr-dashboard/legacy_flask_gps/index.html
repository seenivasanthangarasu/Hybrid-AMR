<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>AMR Live GPS Tracker</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

#map{
    width:100%;
    height:100%;
}

#panel{

    position:absolute;

    top:15px;
    left:15px;

    z-index:9999;

    background:white;

    padding:15px;

    border-radius:10px;

    box-shadow:0px 0px 10px rgba(0,0,0,0.3);

    min-width:250px;
}

.title{

    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.row{
    margin-top:8px;
}

</style>

</head>

<body>

<div id="panel">

<div class="title">
AMR GPS Dashboard
</div>

<div class="row">
GPS Status:
<b id="status">NO FIX</b>
</div>

<div class="row">
Latitude:
<span id="lat">0</span>
</div>

<div class="row">
Longitude:
<span id="lon">0</span>
</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const SERVER_IP = window.location.hostname || "localhost";

var map = L.map('map').setView(
    [13.0827, 80.2707],
    17
);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom:19
    }
).addTo(map);

var marker = L.marker(
    [13.0827,80.2707]
).addTo(map);

marker.bindPopup("AMR");

var firstFix = false;

var trail = [];

var polyline = L.polyline(
    [],
    {
        weight:4
    }
).addTo(map);

async function updateGPS(){

    try{

        let response = await fetch(
            `http://${SERVER_IP}:5000/gps`
        );

        let data = await response.json();

        let lat = data.lat;
        let lon = data.lon;

        document.getElementById("lat").innerText =
            lat.toFixed(7);

        document.getElementById("lon").innerText =
            lon.toFixed(7);

        document.getElementById("status").innerText =
            data.status;

        if(lat !== 0 && lon !== 0){

            marker.setLatLng(
                [lat, lon]
            );

            trail.push(
                [lat, lon]
            );

            polyline.setLatLngs(
                trail
            );

            if(!firstFix){

                map.setView(
                    [lat, lon],
                    19
                );

                firstFix = true;
            }

        }

    }
    catch(error){

        console.log(
            "Connection Error:",
            error
        );
    }
}

updateGPS();

setInterval(
    updateGPS,
    1000
);

</script>

</body>
</html>
