# ==============================================================================
# NavSat Transform Node Configuration
# Integrates GPS Fix (/hiwonder/gps/fix) and IMU (/hiwonder/imu/data_raw) to produce /odometry/gps
# ==============================================================================

navsat_transform:
  ros__parameters:
    frequency: 20.0
    delay: 1.0
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_cartesian_transform: false
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: false
